<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    Compressed favicon build of the VS Code extension icon (media/icon.png).
    Same mark, stripped for small sizes: the Gaussian glow filter and the six
    outer node dots are dropped (both turn to mush under ~24px and the filter
    costs a raster pass for nothing), and the remaining strokes are thickened
    relative to the original so the hexagon still reads at 16px in a tab.
  -->
  <defs>
    <linearGradient id="hm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#25E6FF" />
      <stop offset="1" stop-color="#8B5CF6" />
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="13" fill="#111827" />

  <g stroke="url(#hm)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M32 9 50 19.5v25L32 55 14 44.5v-25z" stroke-width="3.2" />
    <g stroke-width="2.1" opacity=".85">
      <path d="M32 32V16M32 32l13-7.5M32 32l13 7.5M32 32v16M32 32l-13 7.5M32 32l-13-7.5" />
    </g>
  </g>

  <circle cx="32" cy="32" r="4.6" fill="#fff" />
</svg>
